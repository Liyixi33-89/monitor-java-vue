# 生产环境配置 —— 部署到 111.231.57.177 时使用（--spring.profiles.active=prod）
server:
  # 对外由 Nginx 监听 4000（静态前端 + /api、/ws 反代到这里）；
  # 后端本进程绑定 127.0.0.1:48080，不直接对外
  port: 48080

spring:
  datasource:
    url: jdbc:sqlite:${MONITOR_DB_PATH:/opt/monitor/data/monitor.sqlite}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA journal_mode=WAL;
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

monitor:
  jwt:
    # 生产环境必须通过环境变量注入，不再提供默认值
    secret: ${JWT_SECRET}
    expire-minutes: 720
  target-servers:
    - id: 1
      name: "线上服务器-1"
      host: "111.231.57.177"
      ssh-port: 22
      ssh-user: "root"
      ssh-key-path: /root/.ssh/id_rsa
  notify:
    wecom-webhook-url: ${WECOM_WEBHOOK_URL:}
    dingtalk-webhook-url: ${DINGTALK_WEBHOOK_URL:}
  cors:
    allowed-origins:
      - "http://111.231.57.177"
      - "http://111.231.57.177:8081"
      - "http://111.231.57.177:4000"

# Actuator 存活探针供 Nginx/systemd 使用
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.monitor: INFO
  file:
    name: /opt/monitor/logs/monitor-server.log
